<!DOCTYPE html>
<html lang="{{LANG}}" data-theme="portal">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="{{CDN_ASSET_BASE}}/tokens.css" />
    <link rel="icon" href="{{CDN_ASSET_BASE}}/icons/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="{{CDN_ASSET_BASE}}/icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="{{CDN_ASSET_BASE}}/icons/favicon-16x16.png" />
    <link rel="icon" type="image/svg+xml" href="{{CDN_ASSET_BASE}}/icons/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="{{CDN_ASSET_BASE}}/icons/apple-touch-icon.png" />
    <link rel="manifest" href="{{CDN_ASSET_BASE}}/icons/site.webmanifest" />
    <meta name="theme-color" content="#003153" />

    <title>{{TITLE}}</title>
    <meta name="description" content="{{DESCRIPTION}}" />
    <link rel="canonical" href="{{SITE_URL}}/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="{{SITE_NAME}}" />
    <meta property="og:locale" content="{{OG_LOCALE}}" />
    <meta property="og:title" content="{{OG_TITLE}}" />
    <meta property="og:description" content="{{OG_DESCRIPTION}}" />
    <meta property="og:url" content="{{SITE_URL}}/" />
    <meta property="og:image" content="{{OG_IMAGE}}" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="{{OG_TITLE}}" />
    <meta name="twitter:description" content="{{OG_DESCRIPTION}}" />
    <meta name="twitter:image" content="{{OG_IMAGE}}" />
      <script src="/env.js"></script>
  </head>
  <body class="min-h-screen antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
